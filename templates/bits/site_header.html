<header class="site-header container">
    <nav class="d-flex justify-content-between align-items-center py-3">
        <a href="{% url 'core:home' %}" class="fs-3 site-header-logo">Arsalan's Website (Developed With Django)</a>

        <div class="d-flex align-items-center">
            <a href="{% url 'core:product_list' %}" class="btn btn-outline-light btn-sm me-2">Products</a>
            <a href="{% url 'core:cart_detail' %}" id="cart-count-link" class="btn btn-outline-light btn-sm me-2">
                Cart
                <span id="cart-count" class="badge bg-danger rounded-circle position-absolute top-0 start-100 translate-middle p-2" style="font-size: 0.75rem;">0</span>
            </a>

            {% if user.is_authenticated %}
                <div class="dropdown">
                    <a href="#" class="text-white text-decoration-none dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        {{ user.username }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <a href="{% url 'account:login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                <a href="{% url 'account:signup' %}" class="btn btn-outline-light btn-sm me-2">Sign Up</a>
            {% endif %}
        </div>
    </nav>

</header>

<style>


.site-header {
    background-color: #2c2f33; /* خاکستری تیره‌تر ولی روشن‌تر از زمینه بدن */
    color: #f8f9fa;
    box-shadow: 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom: 2rem;
    border-radius: 0.3rem;
}
.site-header a {
    color: #f8f9fa;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s ease;
}
.site-header a:hover {
    color: #ff6f61;
}
.site-header-logo {
    user-select: none;
}
.site-header-link {
    user-select: none;
}
body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: 'Poppins', sans-serif;
    line-height: 1.6;
}

</style>
